; Built-in UI skin (N900i). Copy this file together with the PNGs into
;   .opendoja/skin/<your-skin-id>/
; to start a custom skin.
;
; All coordinates are absolute, unscaled pixels. The origin of every x/y is the
; top-left corner of the bar the element sits in. Host scaling (x2, x3, ...) uses
; nearest-neighbor sampling, so author every image at 1x.
;
; Colors: #RRGGBB or #AARRGGBB.  Comments: a line starting with ; or #,
; or ";" preceded by a space after a value.

[skin]
name = Default (N900i)

[layout]
top_bar_height    = 27
bottom_bar_height = 27
; Width of the strips left and right of the game screen.
side_width        = 2
side_color        = #D7D8DB
; Bar backgrounds: a solid color, optionally with an image drawn at the bar's
; top-left corner in its original size (the image is drawn over the color).
top_bg_color      = #D7D8DB
top_bg_image      =
bottom_bg_color   = #D7D8DB
bottom_bg_image   =

; ---- Icons -----------------------------------------------------------------
; type   : none | battery | signal_antenna | signal | no_signal | iappli
;          "none" has no role: a static decoration. Add as many as you like.
; bar    : top (default) | bottom
; anchor : left (default) | right.  With "right", x is the gap between the
;          icon's right edge and the bar's right edge.
; images : comma-separated file names (alias: image). Order = state order:
;            battery : level 0,1,2,3
;            signal  : strength 1,2,3
;            iappli  : normal, standby, dx, dx-standby
; Icons are drawn in file order and clipped to their bar.

[icon.antenna]
type   = signal_antenna
x      = 2
y      = 1
image  = signal_antenna.png

[icon.signal]
type   = signal
x      = 17
y      = 1
images = signal_1.png, signal_2.png, signal_3.png

[icon.no_signal]
type   = no_signal
x      = 2
y      = 1
image  = no_signal.png

[icon.iappli]
type   = iappli
x      = 36
y      = 0
images = i-appli.png, i-appli_standby.png, i-apply_dx.png, i-apply_dx_standby.png

[icon.battery]
type   = battery
anchor = right
x      = 2
y      = 1
images = battery_0.png, battery_1.png, battery_2.png, battery_3.png

; ---- Soft-key labels (bottom bar) -----------------------------------------
; x      : reference point, measured from the left edge (anchor = left) or
;          from the right edge (anchor = right) of the bottom bar
; align  : left | center | right - how the text sits on the reference point
; y      : top of the text box. Omit to center the text vertically.
; font_size : snapped to the nearest size the emulator supports (8,10,12,16,20,24,30)
; color  : text color
; bg_image / bg_x / bg_y : drawn only while the label has text. Same anchor
;          rule as above, using the image's left (or right) edge.

[softkey.1]
anchor    = left
align     = center
x         = 28
font_size = 12
color     = #FFFFFF
bg_image  = soft_label_bg.png
bg_x      = 2
bg_y      = 0

[softkey.2]
anchor    = right
align     = center
x         = 28
font_size = 12
color     = #FFFFFF
bg_image  = soft_label_bg.png
bg_x      = 2
bg_y      = 0
